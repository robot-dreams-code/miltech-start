<!doctype html>
<html lang="uk">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#181919" />
    <meta name="description" content="Короткий тест від r_d: які напрями оборонних технологій вам підходять і з чого почати навчання." />
    <title>Старт у MilTech — r_d</title>
    <link rel="preload" href="app/fonts/jetbrains-mono-cyrillic-800-normal.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="stylesheet" href="app/styles.css" />
  </head>
  <body>
    <main id="main" tabindex="-1"></main>
    <noscript>Для проходження тесту увімкніть JavaScript.</noscript>

    <!-- 1. Захист від помилок у налаштуваннях -->
    <script src="app/guard.js"></script>
    <!-- 2. Налаштування: тут усе, що можна змінювати -->
    <script src="settings/questions.js"></script>
    <script src="settings/texts.js"></script>
    <script src="settings/courses.js"></script>
    <!-- 3. Логіка й інтерфейс (не редагуються) -->
    <script src="app/engine.js"></script>
    <script>
      if (window.checkSettingsLoaded()) {
        ['app/art.js', 'app/app.js'].forEach(function (src) {
          var s = document.createElement('script');
          s.src = src;
          s.async = false; // зберегти порядок: спершу ілюстрації, потім інтерфейс
          document.body.appendChild(s);
        });
      }
    </script>
  </body>
</html>
